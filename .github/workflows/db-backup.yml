# Nightly off-site database backup.
#
# 1. pg_dump the production database (Render) in custom format.
# 2. Encrypt the dump with a passphrase and keep it as a workflow artifact
#    for 30 days. The repo is public, so the dump is NEVER stored unencrypted.
# 3. Restore the same dump into a standby Postgres database on Neon,
#    so a ready-to-use copy (data + schema + migration history)
#    exists if Render's database goes down. Failover = point DATABASE_URL at it.
# 4. Check that the standby has the same migrations applied as production.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PRIMARY_DATABASE_URL    Render's *External* Database URL (host ends in .render.com)
#   BACKUP_DATABASE_URL     Neon standby URL (direct, not -pooler); optional —
#                           without it only the encrypted dump is produced
#   BACKUP_PASSPHRASE       long random string used to encrypt the dump
#
# See backend/DB_BACKUP.md for setup, restore and failover steps.

name: Database backup

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC (03:00 WAT) every day
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          PRIMARY_DATABASE_URL: ${{ secrets.PRIMARY_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PRIMARY_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::PRIMARY_DATABASE_URL and BACKUP_PASSPHRASE secrets are required"
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          # Newest psql, only used to ask each server its version below.
          sudo apt-get install -y -qq postgresql-client-18

      - name: Check database connections
        env:
          PRIMARY_DATABASE_URL: ${{ secrets.PRIMARY_DATABASE_URL }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          PSQL=/usr/lib/postgresql/18/bin/psql
          check() {  # $1 = label, $2 = url
            host=$(echo "$2" | sed -E 's#^[a-z]+://[^@]*@([^:/?]+).*#\1#')
            echo "$1 host: $host"
            case "$1:$host" in
              primary:*.render.com) ;;
              primary:*)
                echo "::error::PRIMARY_DATABASE_URL looks like Render's *Internal* URL (host '$host'), which only works inside Render. Use the External Database URL (host ends in .render.com)."
                exit 1 ;;
              standby:*-pooler*)
                echo "::error::BACKUP_DATABASE_URL uses Neon's pooled host. Copy the connection string with 'Connection pooling' turned off."
                exit 1 ;;
            esac
            if ! "$PSQL" "$2" -Atc "SELECT 1" > /dev/null; then
              echo "::error::Could not connect to the $1 database. See the psql error above."
              exit 1
            fi
            "$PSQL" "$2" -Atc "SHOW server_version_num" | cut -c1-2
          }
          PRIMARY_MAJOR=$(check primary "$PRIMARY_DATABASE_URL" | tee /dev/stderr | tail -1)
          echo "primary Postgres major version: $PRIMARY_MAJOR"
          if [ -n "$BACKUP_DATABASE_URL" ]; then
            STANDBY_MAJOR=$(check standby "$BACKUP_DATABASE_URL" | tee /dev/stderr | tail -1)
            echo "standby Postgres major version: $STANDBY_MAJOR"
            if [ "$STANDBY_MAJOR" != "$PRIMARY_MAJOR" ]; then
              echo "::warning::Neon is Postgres $STANDBY_MAJOR but Render is $PRIMARY_MAJOR. Recreate the Neon project on version $PRIMARY_MAJOR if the restore fails."
            fi
          fi
          # Use client tools matching the production server.
          if [ "$PRIMARY_MAJOR" != "18" ]; then
            sudo apt-get install -y -qq "postgresql-client-${PRIMARY_MAJOR}"
          fi
          echo "/usr/lib/postgresql/${PRIMARY_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Dump production database
        env:
          PRIMARY_DATABASE_URL: ${{ secrets.PRIMARY_DATABASE_URL }}
        run: |
          pg_dump --version
          pg_dump "$PRIMARY_DATABASE_URL" \
            --format=custom --no-owner --no-privileges \
            --file=nacos.dump
          ls -lh nacos.dump
          # Fail loudly on an empty/corrupt dump instead of overwriting the standby with it.
          # (Not grep -q: it exits early, pg_restore gets SIGPIPE and pipefail fails the step.)
          pg_restore --list nacos.dump > dump-contents.txt
          grep "TABLE DATA public django_migrations" dump-contents.txt

      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "nacos-${STAMP}.dump.gpg" nacos.dump <<< "$BACKUP_PASSPHRASE"

      - name: Upload encrypted dump
        uses: actions/upload-artifact@v4
        with:
          name: nacos-db-${{ env.STAMP }}
          path: nacos-${{ env.STAMP }}.dump.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Restore into standby database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "::warning::BACKUP_DATABASE_URL not set; skipping standby restore"
            exit 0
          fi
          # --clean --if-exists drops and recreates every object from the dump,
          # so the standby mirrors production exactly (including django_migrations).
          pg_restore --dbname="$BACKUP_DATABASE_URL" \
            --clean --if-exists --no-owner --no-privileges \
            --single-transaction --exit-on-error \
            nacos.dump

      - name: Verify standby matches production
        env:
          PRIMARY_DATABASE_URL: ${{ secrets.PRIMARY_DATABASE_URL }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then exit 0; fi
          Q="SELECT count(*) || ' migrations, latest ' || max(app || '.' || name) FROM django_migrations"
          U="SELECT count(*) || ' users' FROM accounts_user"
          P=$(psql "$PRIMARY_DATABASE_URL" -Atc "$Q"; psql "$PRIMARY_DATABASE_URL" -Atc "$U")
          S=$(psql "$BACKUP_DATABASE_URL" -Atc "$Q"; psql "$BACKUP_DATABASE_URL" -Atc "$U")
          echo "primary: $P"
          echo "standby: $S"
          if [ "$P" != "$S" ]; then
            # Writes between the dump and this check can cause a small drift in
            # user count; migration drift means the restore genuinely failed.
            [ "$(echo "$P" | head -1)" = "$(echo "$S" | head -1)" ] \
              || { echo "::error::standby migrations differ from production"; exit 1; }
            echo "::warning::user counts differ slightly (signups during backup?)"
          fi
          echo "### Backup ${STAMP}" >> "$GITHUB_STEP_SUMMARY"
          echo "- primary: $(echo $P)" >> "$GITHUB_STEP_SUMMARY"
          echo "- standby: $(echo $S)" >> "$GITHUB_STEP_SUMMARY"
